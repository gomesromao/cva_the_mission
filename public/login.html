<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#07152b">
<title>THE MISSION</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --ink: #07152b;
    --screen-dark: #0a2e33;
    --teal: #2f8f8c;
    --green: #93d9b4;
    --mint: #edfaf1;
    --error: #e54b4b;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 20px;
    background: var(--ink);
    color: var(--mint);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  form {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }

  /* Same bezel the game screen wears. */
  canvas {
    display: block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-optimize-contrast;
    background: var(--mint);
    border: 3px solid var(--teal);
    box-shadow: 0 0 0 3px var(--ink), 0 10px 30px rgba(0, 0, 0, .55);
  }

  .controls {
    width: 100%;
    max-width: 260px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* Square corners and hard edges, like the dialogue box in the game. */
  input {
    width: 100%;
    font: inherit;
    font-size: 16px; /* anything smaller and iOS Safari zooms the page */
    letter-spacing: 4px;
    text-align: center;
    text-indent: 4px;
    padding: 11px 8px;
    color: var(--ink);
    background: var(--mint);
    border: 3px solid var(--screen-dark);
    border-radius: 0;
    -webkit-appearance: none;
  }
  input::placeholder { color: rgba(10, 46, 51, .45); letter-spacing: 2px; }
  input:focus { outline: 0; border-color: var(--teal); }

  button {
    width: 100%;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 3px;
    text-indent: 3px;
    padding: 13px 8px;
    color: var(--ink);
    background: var(--green);
    border: 3px solid var(--screen-dark);
    border-radius: 0;
    box-shadow: 4px 4px 0 var(--teal);
    cursor: pointer;
  }
  button:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--teal); }

  .err {
    min-height: 13px;
    margin: 0;
    text-align: center;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--error);
    visibility: hidden;
  }
  .err.show { visibility: visible; }
</style>
</head>
<body>
  <form method="POST" action="/api/login">
    <canvas id="plate" width="160" height="144" aria-label="THE MISSION"></canvas>

    <div class="controls">
      <input id="password" name="password" type="password" placeholder="password"
             autocomplete="current-password" autocapitalize="off" autocorrect="off"
             spellcheck="false" required autofocus aria-label="Password">
      <button type="submit">START</button>
      <p class="err" id="err" role="alert">Wrong password</p>
    </div>
  </form>

<script>
(function () {
  'use strict';

  // The mark and the lettering are the game's own pixel data, copied in so this
  // page can stay outside the password gate without exposing the game's files.
  var MARK = [
      '...............1233.333333..............',
      '............2333333.333333..............',
      '..........233333333.233333..............',
      '.........3333333333.2333332.............',
      '.......2333333333332.333333.............',
      '......23333333333332.333333.............',
      '.....233333333332....3333332............',
      '....2333333332.......2333333............',
      '....33333333..........3333333...........',
      '...33333333...........23333333..........',
      '..23333333.............33333332.........',
      '..3333333...............33333333........',
      '.2333333................2333333332......',
      '.3333332.................233333333332...',
      '.333333...................23333333333333',
      '2333333....................2333333333333',
      '2333332......................33333333333',
      '333333........................2333333333',
      '333333..........................23333333',
      '333333..............................2233',
      '333333............................22....',
      '333333............................333333',
      '333333............................333333',
      '2333332..........................2333332',
      '1333333..........................3333332',
      '.333333..........................333333.',
      '.3333332........................2333333.',
      '.2333333........................3333332.',
      '..3333333......................3333333..',
      '..23333333....................33333332..',
      '...33333332..................23333333...',
      '....33333333................333333331...',
      '....2333333332............2333333332....',
      '.....233333333332......233333333333.....',
      '......2333333333333333333333333333......',
      '.......23333333333333333333333332.......',
      '.........33333333333333333333331........',
      '..........23333333333333333332..........',
      '............2333333333333332............',
      '...............1233333322...............'
  ];
  var GLYPHS = { ' ':'0000000000000000', 'E':'F88080F08080F800', 'H':'888888F888888800', 'I':'7020202020207000', 'M':'88D8A88888888800', 'N':'88C8A89888888800', 'O':'7088888888887000', 'S':'7088807008887000', 'T':'F820202020202000', 'a':'0000700878887800', 'c':'0000708880887000', 'n':'0000F08888888800', 'o':'0000708888887000', 'r':'0000B0C080808000', 's':'000078807008F000', 't':'4040F04040483000', 'u':'0000888888887800', 'y':'0000888878087000' };
  var PALETTE = ['#edfaf1', '#93d9b4', '#2f8f8c', '#0a2e33'];
  var ADVANCE = 6;

  var canvas = document.getElementById('plate');
  var ctx = canvas.getContext('2d');
  var image = ctx.createImageData(160, 144);
  var px = new Uint32Array(image.data.buffer);
  var tone = [];

  for (var i = 0; i < 4; i++) {
    var hex = PALETTE[i];
    tone[i] = (255 << 24) |
      (parseInt(hex.substr(5, 2), 16) << 16) |
      (parseInt(hex.substr(3, 2), 16) << 8) |
      parseInt(hex.substr(1, 2), 16);
  }

  px.fill(tone[0]);

  function grid(rows, dx, dy) {
    for (var y = 0; y < rows.length; y++) {
      var row = rows[y];
      for (var x = 0; x < row.length; x++) {
        var ch = row.charAt(x);
        if (ch === '.') continue;
        var tx = dx + x, ty = dy + y;
        if (tx < 0 || tx >= 160 || ty < 0 || ty >= 144) continue;
        px[ty * 160 + tx] = tone[ch.charCodeAt(0) - 48];
      }
    }
  }

  function text(str, dx, dy, toneIndex, scale) {
    for (var i = 0; i < str.length; i++) {
      var hexRows = GLYPHS[str.charAt(i)];
      if (!hexRows) continue;
      for (var r = 0; r < 8; r++) {
        var bits = parseInt(hexRows.substr(r * 2, 2), 16);
        if (!bits) continue;
        for (var b = 0; b < 8; b++) {
          if (!(bits & (0x80 >> b))) continue;
          for (var sy = 0; sy < scale; sy++) {
            for (var sx = 0; sx < scale; sx++) {
              var tx = dx + (i * ADVANCE + b) * scale + sx;
              var ty = dy + r * scale + sy;
              if (tx < 0 || tx >= 160 || ty < 0 || ty >= 144) continue;
              px[ty * 160 + tx] = tone[toneIndex];
            }
          }
        }
      }
    }
  }

  function centred(str, dy, toneIndex, scale) {
    text(str, Math.round((160 - str.length * ADVANCE * scale) / 2), dy, toneIndex, scale);
  }

  grid(MARK, 60, 24);
  centred('THE MISSION', 76, 3, 2);
  centred('a coconut story', 102, 2, 1);
  ctx.putImageData(image, 0, 0);

  function fit() {
    var scale = Math.min((window.innerWidth - 46) / 160, (window.innerHeight - 250) / 144, 3);
    if (scale >= 1) scale = Math.floor(scale);
    if (scale < 1) scale = Math.max(0.6, scale);
    canvas.style.width = Math.floor(160 * scale) + 'px';
    canvas.style.height = Math.floor(144 * scale) + 'px';
  }
  fit();
  window.addEventListener('resize', fit);

  if (location.search.indexOf('e=1') !== -1) {
    document.getElementById('err').className = 'err show';
  }
})();
</script>
</body>
</html>
