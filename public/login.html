<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2a1a12">
<title>THE MISSION</title>
<style>
  :root { --ink:#2a1a12; --dark:#7d5636; --light:#cba36c; --cream:#f4e7c8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 24px;
    background: var(--ink);
    color: var(--cream);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
    -webkit-text-size-adjust: 100%;
  }
  .card {
    width: 100%;
    max-width: 340px;
    text-align: center;
    border: 4px solid var(--dark);
    box-shadow: 0 0 0 4px var(--ink), 0 12px 34px rgba(0,0,0,.5);
    background: var(--cream);
    color: var(--ink);
    padding: 30px 24px 26px;
  }
  h1 { font-size: 20px; letter-spacing: 4px; margin: 0 0 4px; }
  p.sub { font-size: 11px; letter-spacing: 2px; margin: 0 0 22px; color: var(--dark); }
  label { display: block; font-size: 10px; letter-spacing: 2px; margin-bottom: 8px; color: var(--dark); }
  input {
    width: 100%;
    font: inherit;
    font-size: 16px; /* 16px stops iOS Safari from zooming the page on focus */
    letter-spacing: 2px;
    text-align: center;
    padding: 12px 10px;
    color: var(--ink);
    background: #fff;
    border: 3px solid var(--ink);
    border-radius: 0;
    -webkit-appearance: none;
  }
  button {
    width: 100%;
    margin-top: 16px;
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    padding: 13px 10px;
    color: var(--cream);
    background: var(--ink);
    border: 3px solid var(--ink);
    cursor: pointer;
  }
  button:active { transform: translateY(1px); }
  .err {
    display: none;
    margin: 0 0 16px;
    font-size: 11px;
    letter-spacing: 1px;
    color: #a32020;
  }
  .err.show { display: block; }
  .palm { font-size: 30px; line-height: 1; margin-bottom: 10px; }
</style>
</head>
<body>
  <form class="card" method="POST" action="/api/login">
    <div class="palm">&#127796;</div>
    <h1>THE MISSION</h1>
    <p class="sub">a coconut story</p>
    <p class="err" id="err">WRONG PASSWORD. TRY AGAIN.</p>
    <label for="password">ENTER PASSWORD</label>
    <input id="password" name="password" type="password" autocomplete="current-password"
           autocapitalize="off" autocorrect="off" spellcheck="false" required autofocus>
    <button type="submit">START</button>
  </form>
<script>
  if (location.search.indexOf('e=1') !== -1) {
    document.getElementById('err').className = 'err show';
  }
</script>
</body>
</html>
