<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#eaf5ee">
<title>THE MISSION</title>
<link rel="icon" href="logo.png">
<style>
  /* Coconut design tokens. */
  :root {
    --navy-900: #07152b;
    --navy-500: #2c4f8c;
    --green-600: #50b080;
    --green-100: #def2e6;
    --pastel-sky: #c9e6f4;
    --pastel-mint: #bfe9cf;
    --fg-3: #5c6b85;
    --error: #e54b4b;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 32px 24px;
    color: var(--navy-900);
    font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, system-ui, sans-serif;
    /* The brand's own gradient: sky falling into mint. */
    background:
      radial-gradient(120% 90% at 12% 0%, var(--pastel-sky) 0%, transparent 55%),
      radial-gradient(110% 95% at 92% 100%, var(--pastel-mint) 0%, transparent 58%),
      var(--green-100);
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }

  /* No card and no borders: the content simply sits on the gradient. */
  form {
    width: 100%;
    max-width: 288px;
    text-align: center;
  }

  img.mark {
    width: 56px;
    height: 56px;
    display: block;
    margin: 0 auto 26px;
  }

  h1 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 6px;
    text-indent: 6px; /* balances the trailing letter-space */
  }

  p.sub {
    margin: 9px 0 0;
    font-size: 11px;
    letter-spacing: 3px;
    text-indent: 3px;
    text-transform: uppercase;
    color: var(--fg-3);
  }

  .field { margin-top: 46px; }

  /* An underline, not a box. */
  input {
    width: 100%;
    font: inherit;
    font-size: 16px; /* anything smaller and iOS Safari zooms the page */
    letter-spacing: 6px;
    text-align: center;
    text-indent: 6px;
    padding: 10px 4px 12px;
    color: var(--navy-900);
    background: transparent;
    border: 0;
    border-bottom: 2px solid rgba(7, 21, 43, .18);
    border-radius: 0;
    -webkit-appearance: none;
    transition: border-color .18s ease;
  }
  input::placeholder { color: rgba(7, 21, 43, .28); letter-spacing: 3px; }
  input:focus { outline: 0; border-bottom-color: var(--green-600); }

  button {
    width: 100%;
    margin-top: 26px;
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 3px;
    text-indent: 3px;
    padding: 15px 10px;
    color: #fff;
    background: var(--navy-900);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    transition: transform .14s ease, background .18s ease;
  }
  button:hover { background: var(--navy-500); }
  button:active { transform: scale(.98); }

  .err {
    height: 14px;
    margin: 14px 0 0;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--error);
    opacity: 0;
    transition: opacity .2s ease;
  }
  .err.show { opacity: 1; }

  footer {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 22px;
    text-align: center;
    font-size: 10px;
    letter-spacing: 2.5px;
    text-indent: 2.5px;
    text-transform: uppercase;
    color: rgba(7, 21, 43, .35);
  }

  @media (prefers-reduced-motion: reduce) {
    input, button, .err { transition: none; }
  }
</style>
</head>
<body>
  <form method="POST" action="/api/login">
    <img class="mark" src="logo.png" alt="Coconut" width="56" height="56">
    <h1>THE MISSION</h1>
    <p class="sub">a coconut story</p>

    <div class="field">
      <input id="password" name="password" type="password" placeholder="password"
             autocomplete="current-password" autocapitalize="off" autocorrect="off"
             spellcheck="false" required autofocus aria-label="Password">
    </div>

    <button type="submit">Enter</button>
    <p class="err" id="err" role="alert">Wrong password</p>
  </form>

  <footer>Private preview</footer>

<script>
  if (location.search.indexOf('e=1') !== -1) {
    document.getElementById('err').className = 'err show';
  }
</script>
</body>
</html>
