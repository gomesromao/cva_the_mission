<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#07152b">
<meta name="description" content="A short handheld-style game about finding time.">
<title>THE MISSION</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="shell">
  <canvas id="screen" width="160" height="144"></canvas>

  <div id="ending">
    <a id="cta" href="#" target="_blank" rel="noopener">BOOK A CALL</a>
  </div>

  <div id="controls">
    <div class="dpad">
      <button class="pad up" data-key="up" aria-label="Up"></button>
      <button class="pad left" data-key="left" aria-label="Left"></button>
      <button class="pad right" data-key="right" aria-label="Right"></button>
      <button class="pad down" data-key="down" aria-label="Down"></button>
    </div>
    <button class="abtn" data-key="a" aria-label="Action">A</button>
  </div>

  <div id="bar">
    <button id="music-toggle" type="button" aria-pressed="false">MUSIC: OFF</button>
    <span class="hint">ARROWS MOVE &nbsp;/&nbsp; ENTER TALKS</span>
  </div>
</div>

<pre id="boot-error"></pre>

<script src="js/font.js"></script>
<script src="js/sprites.js"></script>
<script src="js/script.js"></script>
<script src="js/maps.js"></script>
<script src="js/audio.js"></script>
<script src="js/game.js"></script>
</body>
</html>
